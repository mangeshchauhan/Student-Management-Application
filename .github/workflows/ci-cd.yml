name: CI/CD
on:
  push:
    branches: [main]
    paths-ignore:
      - manifests/kustomization.yaml
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - name: Validate SonarQube configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -eu
          test -n "$SONAR_HOST_URL" || { echo "SONAR_HOST_URL repository variable is required"; exit 1; }
          test -n "$SONAR_PROJECT_KEY" || { echo "SONAR_PROJECT_KEY repository variable is required"; exit 1; }
          test -n "$SONAR_TOKEN" || { echo "SONAR_TOKEN repository secret is required"; exit 1; }
      - name: Build, test, and analyze with SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          mvn -B clean verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar
          -Dsonar.host.url="$SONAR_HOST_URL"
          -Dsonar.projectKey="$SONAR_PROJECT_KEY"
          -Dsonar.token="$SONAR_TOKEN"
          -Dsonar.qualitygate.wait=true

  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Build image for scanning
        run: |
          set -eu
          test -n "$DOCKERHUB_USERNAME"
          RUN_TAG=$(printf 'build-%010d-%s' "$GITHUB_RUN_NUMBER" "$GITHUB_SHA")
          docker build --pull \
            --tag "$DOCKERHUB_USERNAME/student-management:$GITHUB_SHA" \
            --tag "$DOCKERHUB_USERNAME/student-management:$RUN_TAG" \
            --tag "$DOCKERHUB_USERNAME/student-management:latest" \
            .
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/student-management:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push scanned image to Docker Hub
        run: |
          set -eu
          docker push "$DOCKERHUB_USERNAME/student-management:$GITHUB_SHA"
          RUN_TAG=$(printf 'build-%010d-%s' "$GITHUB_RUN_NUMBER" "$GITHUB_SHA")
          docker push "$DOCKERHUB_USERNAME/student-management:$RUN_TAG"
          docker push "$DOCKERHUB_USERNAME/student-management:latest"
