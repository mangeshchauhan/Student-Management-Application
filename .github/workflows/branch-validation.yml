name: Branch Validation

on:
  pull_request:
    branches: [Dev, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  branch-policy:
    name: Validate source branch
    runs-on: ubuntu-latest
    steps:
      - name: Enforce Feature to Dev and Dev to main flow
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -eu
          case "$BASE_BRANCH" in
            Dev)
              case "$HEAD_BRANCH" in
                Feature/*|feature/*) ;;
                *)
                  echo "Pull requests into Dev must come from Feature/<ticket-or-name>."
                  exit 1
                  ;;
              esac
              ;;
            main)
              if [ "$HEAD_BRANCH" != "Dev" ]; then
                echo "Pull requests into main must come from Dev."
                exit 1
              fi
              ;;
            *)
              echo "Pull request target must be Dev or main."
              exit 1
              ;;
          esac
          echo "Allowed promotion: $HEAD_BRANCH -> $BASE_BRANCH"

  validate:
    name: Build, test, and scan
    needs: branch-policy
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: student-management:pr-${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and run tests
        run: mvn -B clean verify
      - name: Build image for vulnerability scanning
        run: docker build --pull --tag "$IMAGE_TAG" .
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
