name: Branch Validation

on:
  pull_request:
    branches: [Dev, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  branch-policy:
    name: Validate source branch
    runs-on: ubuntu-latest
    steps:
      - name: Enforce Feature to Dev and Dev to main flow
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -eu
          case "$BASE_BRANCH" in
            Dev)
              case "$HEAD_BRANCH" in
                Feature/*|feature/*) ;;
                *)
                  echo "Pull requests into Dev must come from Feature/<ticket-or-name>."
                  exit 1
                  ;;
              esac
              ;;
            main)
              if [ "$HEAD_BRANCH" != "Dev" ]; then
                echo "Pull requests into main must come from Dev."
                exit 1
              fi
              ;;
            *)
              echo "Pull request target must be Dev or main."
              exit 1
              ;;
          esac
          echo "Allowed promotion: $HEAD_BRANCH -> $BASE_BRANCH"
