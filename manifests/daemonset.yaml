apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: student-management-daemonset
  namespace: student-management
spec:
  selector:
    matchLabels:
      app: student-management
  template:
    metadata:
      labels:
        app: student-management
    spec:
      containers:
      - name: student-management
        image: mangeshc225/student-management:latest
        ports:
        - containerPort: 8080
