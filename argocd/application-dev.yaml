apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: student-management-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mangeshchauhan/Student-Management-Application.git
    targetRevision: Dev
    path: manifests/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: student-management-dev
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
