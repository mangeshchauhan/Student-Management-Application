apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: student-management
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: student-management
      images:
        - alias: student-management
          imageName: mangeshc225/student-management:latest
          commonUpdateSettings:
            updateStrategy: alphabetical
            allowTags: '^build-[0-9]{10}-[0-9a-f]{40}$'
          manifestTargets:
            kustomize:
              name: mangeshc225/student-management
  writeBackConfig:
    method: git:secret:git-creds
    gitConfig:
      branch: main
      writeBackTarget: kustomization
